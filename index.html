<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below.
  To switch themes, change `data-theme` to any id defined in src/themes.ts.
  Color values per theme live in src/themes.css.
-->
<html lang="en" data-theme="longtable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>Longtable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      html { background-color: #3c2a1e; color-scheme: dark; }
      html[data-theme="paper"] { background-color: #ffffff; color-scheme: light; }
      html[data-theme="slate"] { background-color: #0a0a0a; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
